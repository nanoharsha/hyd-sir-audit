<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trilokpuri AC 55 SIR Dashboard</title>
<style>
:root{--bg:#f6f5f1;--surface:#fcfcfb;--alt:#f1efe9;--ink:#1c1c1c;--muted:#6b6b66;--rule:#d9d6cc;--navy:#243b55;--navy-on:#fff;
 /* the five outcome colours: validated categorical slots (light), fixed segment order Notice > Cleared > ASDD > Deleted > Not found */
 --c-notice:#eda100;--c-cleared:#1baf7a;--c-asdd:#e34948;--c-del:#2a78d6;--c-nf:#e87ba4}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--surface:#1a1a19;--alt:#242423;--ink:#eee;--muted:#a3a3a0;--rule:#3a3a3a;--navy:#8fb0d8;--navy-on:#111;
 --c-notice:#c98500;--c-cleared:#199e70;--c-asdd:#e66767;--c-del:#3987e5;--c-nf:#d55181}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip,select,input{font:inherit;padding:7px 12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:6px}
.chip{cursor:pointer}select{max-width:100%}.chip.on{background:var(--navy);color:var(--navy-on);border-color:var(--navy)}
.scope{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0}
/* headline stat tiles */
.heads{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.head{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--navy);padding:14px 16px 12px;border-radius:2px}
.head .n{display:block;font-weight:700;font-size:34px;line-height:1.05;color:var(--ink)}
.head .lbl{display:block;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-top:8px}
.head .pc{display:block;font-size:14px;font-weight:600;margin-top:4px}
.head .s{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.head.del{border-top-color:var(--c-del)}.head.asdd{border-top-color:var(--c-asdd)}.head.not{border-top-color:var(--c-notice)}
h2{font-size:16px;margin:26px 0 6px}.note{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:90ch}
/* where the base roll ended up: one stacked bar + its table twin */
.card{background:var(--surface);border:1px solid var(--rule);padding:14px 16px;border-radius:2px}
.stack{display:flex;gap:2px;height:22px;margin:4px 0 14px}
.stack>div{min-width:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:visible;white-space:nowrap}
.stack>div:first-child{border-radius:4px 0 0 4px}.stack>div:last-child{border-radius:0 4px 4px 0}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 18px}
.leg div{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:baseline;font-size:13px}
.leg i{width:12px;height:12px;border-radius:2px;display:inline-block;transform:translateY(1px)}
.leg b{font-variant-numeric:tabular-nums}.leg small{color:var(--muted)}
.leg .d{grid-column:2/4;color:var(--muted);font-size:12px;margin-top:-4px}
.tw{overflow:auto;border:1px solid var(--rule);background:var(--surface);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--navy);color:var(--navy-on);cursor:pointer;font-size:12px;z-index:1}
th:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
td:first-child,th:first-child,td.l,th.l{text-align:left}td.l{white-space:normal;min-width:180px;max-width:300px}
tr.crit td{background:rgba(237,161,0,.16)}
tfoot td{font-weight:700;position:sticky;bottom:0;background:var(--alt);border-top:2px solid var(--navy)}
tr.un td{color:var(--muted);font-style:italic}
td small{color:var(--muted)}
.foot{margin-top:28px;color:var(--muted);font-size:12px;max-width:110ch}.foot p{margin:0 0 8px}
@media(max-width:560px){.head .n{font-size:30px}}
</style></head><body><div class="wrap">
<h1>Trilokpuri (AC 55) — SIR 2026 dashboard</h1>
<p class="sub" id="sub"></p>
<div class="bar">
  <button class="chip on" id="bAll" onclick="setScope('all')">Entire Trilokpuri</button>
  <select id="pick" onchange="setScope('part',this.value)" aria-label="Choose one part (2025 booth)"></select>
</div>
<div class="scope" id="scope"></div>
<div class="heads" id="heads"></div>

<h2>Where the base roll ended up</h2>
<p class="note" id="endNote"></p>
<div class="card"><div class="stack" id="stack" role="img" aria-label="Share of the base roll by outcome"></div><div class="leg" id="leg"></div></div>
<p class="note" id="una" style="margin-top:10px"></p>

<h2>By part (2025 booth)</h2>
<p class="note" id="oldNote"></p>
<div class="bar"><input id="flt" placeholder="Filter by part number or area…" oninput="drawOld()" style="min-width:260px" aria-label="Filter parts"></div>
<div class="tw"><table id="tOld"></table></div>

<h2>By new part (2026 booth)</h2>
<p class="note" id="newNote"></p>
<div class="tw"><table id="tNew"></table></div>

<div class="foot" id="foot"></div>
</div>
<script>
const D=/*DATA*/null;
const A=D.ac;
const f=n=>Number(n||0).toLocaleString("en-IN"),pc=(a,b)=>b?(100*a/b).toFixed(1)+"%":"–";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short=s=>{const a=String(s||"").split(" | ");return esc(a[0])+(a.length>1?" +"+(a.length-1):"")};
/* outcome categories, in bar order (notice + cleared together = on the draft) */
const END=[["NOTICE","On the draft, with a notice","c-notice"],["CLEARED","On the draft, no notice","c-cleared"],["ASDD","ASDD list (left out of the draft)","c-asdd"],["DELETED","Pre-SIR deletion","c-del"],["NOTFOUND","Not found, or unclear","c-nf"]];
let scope="all",part=0,sortOld={k:"p",d:1},sortNew={k:"p",d:1};

function sum(rows){const z={base:0,roll:0,added:0,stamped:0,del:0,delAny:0,asdd:0,notice:0,draft:0,end:{},asddR:{},noticeT:{}};
  rows.forEach(p=>{z.base+=p.base;z.roll+=p.roll;z.added+=p.added;z.stamped+=p.stamped;z.del+=p.del;z.delAny+=p.del_any;z.asdd+=p.asdd;z.notice+=p.notice;z.draft+=p.draft;
    for(const k in p.end)z.end[k]=(z.end[k]||0)+p.end[k];for(const k in p.asdd_r)z.asddR[k]=(z.asddR[k]||0)+p.asdd_r[k];for(const k in p.notice_t)z.noticeT[k]=(z.noticeT[k]||0)+p.notice_t[k]});return z}
const sel=()=>D.parts.filter(p=>scope==="all"||p.p===part);
/* "critical" = the Okhla rule: (ASDD + not found) share of the base roll AND notice share of the draft are both above the constituency average */
const TOT=sum(D.parts),avgAB=(A.asdd+A.end.NOTFOUND)/A.base,avgN=A.notice/A.draft;
const nf=p=>p.end.NOTFOUND;
const crit=p=>p.base>0&&p.draft>0&&(p.asdd+nf(p))/p.base>avgAB&&p.notice/p.draft>avgN;
const parts=s=>Object.entries(s).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]);

function setScope(s,v){scope=s;part=+v||0;
  document.getElementById("bAll").classList.toggle("on",s==="all");
  if(s!=="part")document.getElementById("pick").value="0";
  draw();drawOld();drawNew()}

function draw(){
  const rows=sel(),z=sum(rows),all=scope==="all",p0=rows[0];
  const draftN=all?A.draft:z.draft,noticeN=all?A.notice:z.notice,asddN=all?A.asdd:z.asdd;
  document.getElementById("scope").textContent=all?"Entire Trilokpuri — all "+A.old_parts+" parts (2025 booths)":"Part "+part+" (2025 booth) — "+short(p0&&p0.loc).replace(/&amp;/g,"&");
  const reason={"Permanently Shifted":"shifted","Untraceable/Absent":"absent","Death":"dead","Already enrolled":"duplicate"};
  const ttype={"Logical discrepancy only":"logical discrepancy","Unmapped (no link to 2002 roll)":"not linked to the 2002 roll","Reason blank in PDF":"reason blank"};
  const aR=all?A.asdd_by_reason:z.asddR,nT=all?A.notice_by_type:z.noticeT;
  document.getElementById("heads").innerHTML=
   `<div class="head"><span class="n">${f(z.base)}</span><span class="lbl">Base roll</span><span class="s">${f(z.roll)} in the 2025 roll + ${f(z.added)} added in the monthly lists (Feb 2025 – Jun 2026)${z.stamped?`. Left out: ${f(z.stamped)} already struck off inside the 2025 roll`:""}</span></div>`+
   `<div class="head del"><span class="n">${f(z.del)}</span><span class="lbl">Pre-SIR deletions</span><span class="pc">${pc(z.del,z.base)} of the base roll</span><span class="s">Removed in a monthly deletion list and on no later list. ${f(z.delAny)} voters appear in those lists; ${f(z.delAny-z.del)} are still on the draft, ASDD or notice list</span></div>`+
   `<div class="head asdd"><span class="n">${f(asddN)}</span><span class="lbl">ASDD</span><span class="pc">${pc(asddN,z.base)} of the base roll</span><span class="s">${parts(aR).map(([k,v])=>f(v)+" "+(reason[k]||esc(k))).join(" · ")}</span></div>`+
   `<div class="head"><span class="n">${f(draftN)}</span><span class="lbl">Draft SIR 2026</span><span class="pc">${pc(draftN,all?A.base:z.base)} of the base roll</span><span class="s">${all?"Names on the draft roll of 31 Aug 2026, "+A.draft_parts+" booths":"Names on the draft who were in this 2025 booth"}</span></div>`+
   `<div class="head not"><span class="n">${f(noticeN)}</span><span class="lbl">Notices</span><span class="pc">${pc(noticeN,draftN)} of the draft</span><span class="s">${parts(nT).map(([k,v])=>f(v)+" "+(ttype[k]||esc(k))).join(" · ")}</span></div>`;
  drawEnd(z);
  document.getElementById("una").textContent=all?"Not placed in a 2025 booth: "+f(A.draft_unplaced)+" draft names and "+f(A.notice_unplaced)+" notices belong to people who are not in the base roll (new entrants who appear only on the draft or on a SIR list). They are in the Draft SIR and Notices totals above, but not in the part tables.":"";
}

function drawEnd(z){
  const e=Object.assign({},z.end,{NOTFOUND:(z.end.NOTFOUND||0)+(z.end.OTHER||0)});   // "not found, or unclear" = found on no list + 76-ish with a record elsewhere / no readable ID
  const tot=END.reduce((a,[k])=>a+(e[k]||0),0)||1;
  document.getElementById("stack").innerHTML=END.map(([k,l,c])=>{const n=e[k]||0,w=100*n/tot;
    return n?`<div style="flex:${n} 1 0;background:var(--${c})" title="${l}: ${f(n)} (${pc(n,tot)})">${w>=7?pc(n,tot):""}</div>`:""}).join("");
  document.querySelectorAll("#stack>div").forEach(d=>{d.style.color=readable(getComputedStyle(d).backgroundColor)});
  document.getElementById("leg").innerHTML=END.map(([k,l,c])=>{const n=e[k]||0;
    return `<div><i style="background:var(--${c})"></i><span>${l}</span><span><b>${f(n)}</b> <small>${pc(n,tot)}</small></span>`+(k==="NOTFOUND"?`<span class="d">${f(z.end.NOTFOUND||0)} found on no list and not deleted + ${f(z.end.OTHER||0)} with a record elsewhere in Delhi or no readable voter ID</span>`:"")+`</div>`}).join("");
  document.getElementById("endNote").textContent="Each of the "+f(tot)+" voters in the base roll is counted once, by the latest record about them. Notice + no-notice = on the draft roll.";
}
function readable(rgb){const m=rgb.match(/\d+/g).map(Number),l=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)},L=.2126*l(m[0])+.7152*l(m[1])+.0722*l(m[2]);return (L+.05)/.05>=1.05/(L+.05)?"#0b0b0b":"#fff"}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>draw());

function table(el,cols,rows,s,redraw,foot){
  rows=[...rows].sort((a,b)=>{const c=cols.find(c=>c.k===s.k),x=c.v(a),y=c.v(b);return (x>y?1:x<y?-1:0)*s.d});
  el.innerHTML="<thead><tr>"+cols.map(c=>`<th scope="col" class="${c.l?"l":""}" tabindex="0" role="button" aria-sort="${s.k===c.k?(s.d>0?"ascending":"descending"):"none"}" onclick="${redraw}('${c.k}')" onkeydown="if(event.key==='Enter')${redraw}('${c.k}')">${c.h}${s.k===c.k?(s.d>0?" ▲":" ▼"):""}</th>`).join("")+"</tr></thead><tbody>"+
   rows.map(r=>`<tr class="${r._c||""}">`+cols.map(c=>`<td class="${c.l?"l":""}">${c.f(r)}</td>`).join("")+"</tr>").join("")+"</tbody>"+(foot||"");
}
const cell=(n,d)=>`${f(n)} <small>${pc(n,d)}</small>`;
function drawOld(){
  const q=(document.getElementById("flt").value||"").toLowerCase().trim();
  let rows=D.parts.filter(p=>(scope==="all"||p.p===part)&&(!q||String(p.p)===q||(p.loc||"").toLowerCase().includes(q))).map(p=>Object.assign({},p,{_c:crit(p)?"crit":""}));
  const ncrit=D.parts.filter(crit).length;
  document.getElementById("oldNote").textContent="Base roll and pre-SIR deletions are counted in the 2025 booths; ASDD, notices and draft names are placed in the 2025 booth they came from. Shaded = critical: ASDD + not found as a share of the base roll AND notices as a share of the draft are both above the Trilokpuri-wide average ("+(100*avgAB).toFixed(1)+"% and "+(100*avgN).toFixed(1)+"%) — "+ncrit+" of "+A.old_parts+" parts. Click a heading to sort.";
  const foot="<tfoot><tr><td>Total</td><td class='l'></td><td class='l'></td>"+(()=>{const z=sum(rows);const all=scope==="all"&&!q;
    return `<td>${f(z.base)}</td><td>${cell(z.del,z.base)}</td><td>${cell(all?A.asdd:z.asdd,z.base)}</td><td>${f(all?A.draft:z.draft)}</td><td>${cell(all?A.notice:z.notice,all?A.draft:z.draft)}</td><td>${f(rows.reduce((a,p)=>a+nf(p),0))}</td></tr></tfoot>`})();
  table(document.getElementById("tOld"),[
   {k:"p",h:"Part",v:p=>p.p,f:p=>(p._c?"⚠ ":"")+p.p},
   {k:"loc",h:"Area",l:1,v:p=>p.loc,f:p=>short(p.loc)},
   {k:"np",h:"New parts",l:1,v:p=>p.np,f:p=>esc(p.np)},
   {k:"base",h:"Base roll",v:p=>p.base,f:p=>f(p.base)},
   {k:"del",h:"Pre-SIR deletions (% base)",v:p=>p.del,f:p=>cell(p.del,p.base)},
   {k:"asdd",h:"ASDD (% base)",v:p=>p.asdd,f:p=>cell(p.asdd,p.base)},
   {k:"draft",h:"Draft SIR",v:p=>p.draft,f:p=>f(p.draft)},
   {k:"not",h:"Notices (% draft)",v:p=>p.notice,f:p=>cell(p.notice,p.draft)},
   {k:"nf",h:"Not found anywhere",v:p=>nf(p),f:p=>f(nf(p))},
  ],rows,sortOld,"sortO",foot);
}
function sortO(k){sortOld=sortOld.k===k?{k,d:-sortOld.d}:{k,d:k==="p"||k==="loc"||k==="np"?1:-1};drawOld()}
function drawNew(){
  const from=s=>[...String(s||"").matchAll(/(\d+) \(/g)].map(m=>+m[1]);
  const rows=D.newparts.filter(x=>scope==="all"||from(x.from).includes(part));
  document.getElementById("newNote").textContent=(scope==="all"?"":"Showing the "+rows.length+" new booths that took voters from old part "+part+". ")+"Draft names, notices and ASDD are counted exactly in the booth printed on each list. Pre-SIR deletions and not-found voters are not on any 2026 list, so their booth is the pack’s best estimate.";
  const z=rows.reduce((a,x)=>({draft:a.draft+x.draft,notice:a.notice+x.notice,asdd:a.asdd+x.asdd,del:a.del+x.del,nf:a.nf+x.nf}),{draft:0,notice:0,asdd:0,del:0,nf:0});
  const foot=`<tfoot><tr><td>Total</td><td class="l"></td><td class="l"></td><td>${f(z.draft)}</td><td>${cell(z.notice,z.draft)}</td><td>${f(z.asdd)}</td><td>${f(z.del)}</td><td>${f(z.nf)}</td></tr></tfoot>`;
  table(document.getElementById("tNew"),[
   {k:"p",h:"New part",v:x=>x.p,f:x=>x.p},
   {k:"loc",h:"Area",l:1,v:x=>x.loc,f:x=>short(x.loc.replace(/ ?\d+ - /g," | ").replace(/^ \| /,""))},
   {k:"from",h:"From old parts",l:1,v:x=>x.from,f:x=>esc(x.from)},
   {k:"draft",h:"Draft SIR",v:x=>x.draft,f:x=>f(x.draft)},
   {k:"notice",h:"Notices (% draft)",v:x=>x.notice,f:x=>cell(x.notice,x.draft)},
   {k:"asdd",h:"ASDD",v:x=>x.asdd,f:x=>f(x.asdd)},
   {k:"del",h:"Pre-SIR deletions (est.)",v:x=>x.del,f:x=>f(x.del)},
   {k:"nf",h:"Not found (est.)",v:x=>x.nf,f:x=>f(x.nf)},
  ],rows,sortNew,"sortN",foot);
}
function sortN(k){sortNew=sortNew.k===k?{k,d:-sortNew.d}:{k,d:k==="p"||k==="loc"||k==="from"?1:-1};drawNew()}

document.getElementById("pick").innerHTML='<option value="0">Choose one part…</option>'+D.parts.map(p=>`<option value="${p.p}">${p.p} · ${(p.loc||"").split(" | ")[0].replace(/[<&]/g,"")}</option>`).join("");
document.getElementById("sub").textContent="Counts only — no names or voter IDs. Data: Trilokpuri audit pack, "+D.source+". Page made "+D.generated+".";
const mname=m=>new Date(m+"-01T00:00:00").toLocaleString("en-GB",{month:"short",year:"numeric"});
document.getElementById("foot").innerHTML=
 `<p><b>Base roll</b> = voters in the January 2025 roll who were not already struck off inside it (${f(A.roll_printed)} names printed − ${f(A.roll_struck)} struck off = ${f(A.roll_active)}) + ${f(A.added)} voters added in the monthly lists who are not in that roll. ${f(A.added_voters_on_lists)} voters appear on the addition lists; ${f(A.added_in_roll_already)} were already in the 2025 roll, so they are counted once. This differs from the Okhla dashboard, which subtracts the monthly deletions from the base roll; here the deletions are shown against it.</p>`+
 `<p><b>Pre-SIR deletions</b> = base-roll voters in a monthly deletion list and on no later SIR list (the latest record wins, as in the Okhla dashboard). ${f(A.deleted_any)} base-roll voters appear in a deletion list; ${f(A.deleted_any-A.deleted)} of them are still printed on the draft roll or on the ASDD or notice list, so they are counted there (the pack lists them as conflicts to check: ${Object.entries(A.conflicts).map(([k,v])=>f(v)+" “"+esc(k)+"”").join("; ")}). Months present in the pack: ${mname(D.months[0])} – ${mname(D.months[1])}${D.months_missing_between.length?" (no list for "+D.months_missing_between.map(mname).join(", ")+")":""}; the period is written Feb 2025 – Jun 2026 as for Okhla.</p>`+
 `<p><b>ASDD, Notices, Draft SIR</b> are the published lists, counted as published (${f(A.asdd)} ASDD rows, ${f(A.notice)} notice rows, ${f(A.draft)} draft names). A few people on these lists are not in the base roll as defined, so the outcome bar above (which counts base-roll voters only) shows ${f(A.end.ASDD)} ASDD and ${f(A.end.NOTICE)} notices.</p>`+
 `<p>The 2025 roll and the draft roll were read by machine (OCR); a few names, house numbers or ages may be misread. ASDD and notice lists are exact copies of the published text. 154 old booths became 182 new booths, so a person’s old and new part numbers differ.</p>`;
setScope("all");
</script></body></html>
